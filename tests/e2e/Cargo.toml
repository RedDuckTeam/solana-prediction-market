# A workspace of its own, deliberately. LiteSVM pins an exact runtime version in
# the main workspace, and `solana-client` pulls transitive crates that cannot be
# unified with it. Two lockfiles is the honest answer; one would mean one of the
# two test layers had to go.
[workspace]

[package]
name = "e2e-tests"
description = "End-to-end runs against a real solana-test-validator."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]

[dev-dependencies]
anchor-lang = "1.1.2"
base64 = "0.22"
prediction-market = { path = "../../programs/prediction-market", features = ["no-entrypoint"] }
market-feeds = { path = "../../crates/market-feeds" }
market-math = { path = "../../crates/market-math" }
market-vm = { path = "../../crates/market-vm" }
bincode = "1.3"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
solana-compute-budget-interface = "3"
solana-sdk = "4"
spl-token = "9"
