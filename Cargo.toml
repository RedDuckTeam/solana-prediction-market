[workspace]
members = [
    "crates/market-math",
    "crates/market-vm",
    "crates/market-feeds",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/RedDuckTeam/solana-prediction-market"

[workspace.dependencies]
market-math = { path = "crates/market-math" }
market-vm = { path = "crates/market-vm" }
market-feeds = { path = "crates/market-feeds" }

anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
solana-sha256-hasher = "3"
solana-keccak-hasher = "3"
uint = { version = "0.10", default-features = false }
# Required by Anchor's `zero_copy`, which the demo feed uses to mirror a layout.
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
proptest = "1"

[profile.release]
# Second line of defence: every arithmetic site is already `checked_*`, but a
# missed one must abort rather than silently wrap. Money is at stake here.
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
